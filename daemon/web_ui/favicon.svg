<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- OpenStation Max favicon: the station's home-screen orb on the admin panel's glass tile.
       The PNG fallbacks next to this file are rendered from it by scripts/build_favicon.py -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#00d4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- orb: deep core, rim lit in the brand colours (accent, accent2, pink) -->
    <radialGradient id="core">
      <stop offset="0" stop-color="#2a1f8a"/>
      <stop offset="0.45" stop-color="#5a3ccc"/>
      <stop offset="0.8" stop-color="#9a5cf0"/>
      <stop offset="1" stop-color="#d4b4ff"/>
    </radialGradient>
    <radialGradient id="cyan" gradientUnits="userSpaceOnUse" cx="20.5" cy="20.5" r="15">
      <stop offset="0" stop-color="#a8f4ff"/>
      <stop offset="0.45" stop-color="#00d4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" gradientUnits="userSpaceOnUse" cx="20" cy="42" r="10">
      <stop offset="0" stop-color="#ff6ebc"/>
      <stop offset="0.5" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth">
      <stop offset="0" stop-color="#0a0d33" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#0a0d33" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a0d33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="63" height="63" rx="14" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="32" cy="32" r="29" fill="url(#halo)"/>

  <circle cx="32" cy="32" r="16" fill="url(#core)"/>
  <circle cx="32" cy="32" r="16" fill="url(#cyan)"/>
  <circle cx="32" cy="32" r="16" fill="url(#pink)"/>
  <circle cx="32" cy="32" r="16" fill="url(#depth)"/>
  <ellipse cx="32" cy="18.5" rx="6" ry="3" fill="url(#spec)"/>
</svg>
